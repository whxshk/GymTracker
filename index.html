<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Cutting Gym Tracker</title>
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icon.svg">
    <meta name="theme-color" content="#0B0F19">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Gym Tracker">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background: #0B0F19;
            color: #f1f5f9;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            overscroll-behavior-y: none;
            padding-bottom: 8rem;
            min-height: 100vh;
        }

        button { font-family: inherit; }

        /* ── Header ── */
        .app-header {
            position: sticky;
            top: 0;
            z-index: 30;
            background: rgba(11,15,25,0.9);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border-bottom: 1px solid rgba(255,255,255,0.05);
            padding: 1rem;
            box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5);
        }
        .header-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 448px;
            margin: 0 auto;
        }
        .header-left { display: flex; align-items: center; gap: 0.75rem; }
        .day-badge {
            padding: 0.5rem;
            border-radius: 0.75rem;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            box-shadow: 0 10px 15px -3px rgba(0,0,0,0.3);
            flex-shrink: 0;
        }
        .workout-title {
            font-size: 1.25rem;
            font-weight: 900;
            font-style: italic;
            letter-spacing: -0.025em;
            color: #fff;
            text-transform: uppercase;
        }
        .workout-focus {
            font-size: 10px;
            color: #94a3b8;
            font-weight: 700;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            display: flex;
            align-items: center;
            gap: 0.25rem;
            margin-top: 2px;
        }
        .workout-focus svg { color: #60a5fa; }
        .reset-btn {
            width: 2.5rem;
            height: 2.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(255,255,255,0.05);
            border-radius: 50%;
            color: #94a3b8;
            border: 1px solid rgba(255,255,255,0.1);
            cursor: pointer;
            transition: all 0.2s;
            flex-shrink: 0;
        }
        .reset-btn:hover { background: rgba(255,255,255,0.1); }
        .reset-btn:active { transform: scale(0.9); }

        /* ── Progress ── */
        .progress-wrap {
            max-width: 448px;
            margin: 1rem auto 0;
        }
        .progress-labels {
            display: flex;
            justify-content: space-between;
            font-size: 10px;
            font-weight: 700;
            color: #94a3b8;
            margin-bottom: 6px;
            padding: 0 4px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }
        .progress-labels span { display: flex; align-items: center; gap: 4px; }
        .progress-track {
            height: 6px;
            background: #1e293b;
            border-radius: 9999px;
            overflow: hidden;
        }
        .progress-fill {
            height: 100%;
            border-radius: 9999px;
            transition: width 0.5s ease-out;
        }

        /* ── Main ── */
        main {
            max-width: 448px;
            margin: 0 auto;
            padding: 1rem;
        }

        /* ── Timer ── */
        .timer-card {
            background: #121826;
            border: 1px solid rgba(59,130,246,0.3);
            border-radius: 1rem;
            padding: 1rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 0 30px -5px rgba(59,130,246,0.3);
            position: sticky;
            top: 108px;
            z-index: 20;
            backdrop-filter: blur(12px);
            margin-bottom: 1rem;
        }
        .timer-left { display: flex; align-items: center; gap: 1rem; }
        .timer-circle-wrap {
            position: relative;
            width: 3rem;
            height: 3rem;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }
        .timer-svg {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            transform: rotate(-90deg);
        }
        .timer-clock-icon { position: relative; z-index: 1; color: #60a5fa; }
        .timer-phase {
            font-size: 10px;
            font-weight: 700;
            color: #60a5fa;
            text-transform: uppercase;
            letter-spacing: 0.08em;
        }
        .timer-digits {
            font-size: 1.875rem;
            font-weight: 900;
            font-family: monospace;
            line-height: 1;
            letter-spacing: -0.05em;
            color: #fff;
        }
        .timer-skip {
            background: rgba(59,130,246,0.1);
            color: #60a5fa;
            padding: 0.625rem 1.25rem;
            border-radius: 0.75rem;
            font-size: 0.75rem;
            font-weight: 700;
            border: 1px solid rgba(59,130,246,0.2);
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            transition: background 0.2s;
        }
        .timer-skip:active { background: rgba(59,130,246,0.2); }

        /* ── Exercise cards ── */
        .exercise-list { display: flex; flex-direction: column; gap: 1rem; margin-bottom: 1rem; }

        .ex-card {
            background: #121826;
            border-radius: 1.5rem;
            border: 1px solid rgba(255,255,255,0.05);
            overflow: hidden;
            transition: border-color 0.3s, box-shadow 0.3s;
        }
        .ex-card.all-done {
            border-color: rgba(16,185,129,0.3);
            box-shadow: 0 0 20px -10px rgba(16,185,129,0.2);
        }

        .card-top {
            padding: 1.25rem;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            position: relative;
            overflow: hidden;
        }
        .card-emoji-bg {
            position: absolute;
            right: -1rem;
            top: -1rem;
            font-size: 4.5rem;
            opacity: 0.05;
            pointer-events: none;
            filter: grayscale(1);
            line-height: 1;
        }
        .card-info-row {
            display: flex;
            gap: 1rem;
            margin-bottom: 0.75rem;
            position: relative;
            z-index: 1;
            padding-right: 5rem;
        }
        .card-img-wrap { position: relative; flex-shrink: 0; }
        .card-img {
            width: 4rem;
            height: 4rem;
            border-radius: 1rem;
            object-fit: cover;
            border: 1px solid rgba(255,255,255,0.1);
            box-shadow: 0 10px 15px -3px rgba(0,0,0,0.5);
            display: block;
        }
        .card-emoji-badge {
            position: absolute;
            bottom: -0.5rem;
            right: -0.5rem;
            font-size: 1.125rem;
            background: #121826;
            border-radius: 50%;
            padding: 0.25rem;
            border: 1px solid rgba(255,255,255,0.1);
            line-height: 1.2;
        }
        .card-name {
            font-size: 1.125rem;
            font-weight: 700;
            color: #fff;
            line-height: 1.25;
            margin-bottom: 0.5rem;
        }
        .tags { display: flex; flex-wrap: wrap; gap: 6px; }
        .tag {
            padding: 2px 8px;
            background: rgba(255,255,255,0.05);
            border-radius: 6px;
            font-size: 9px;
            font-weight: 700;
            color: #94a3b8;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            border: 1px solid rgba(255,255,255,0.05);
        }

        .card-stats {
            display: flex;
            align-items: stretch;
            gap: 0;
            margin-top: 1rem;
            background: rgba(0,0,0,0.2);
            padding: 0.625rem;
            border-radius: 0.75rem;
            border: 1px solid rgba(255,255,255,0.05);
            position: relative;
            z-index: 1;
        }
        .stat {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .stat + .stat { border-left: 1px solid rgba(255,255,255,0.1); }
        .stat-label {
            font-size: 9px;
            color: #64748b;
            text-transform: uppercase;
            font-weight: 700;
            letter-spacing: 0.1em;
            margin-bottom: 4px;
        }
        .stat-val {
            font-size: 0.875rem;
            font-weight: 700;
            color: #fff;
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .stat-val svg { flex-shrink: 0; }

        .weight-box {
            margin-top: 0.5rem;
            background: rgba(59,130,246,0.1);
            padding: 0.625rem;
            border-radius: 0.75rem;
            border: 1px solid rgba(59,130,246,0.2);
            text-align: center;
            position: relative;
            z-index: 1;
        }
        .weight-label {
            font-size: 9px;
            color: #60a5fa;
            text-transform: uppercase;
            font-weight: 700;
            letter-spacing: 0.1em;
            display: block;
            margin-bottom: 2px;
        }
        .weight-val { font-size: 0.875rem; font-weight: 700; color: #bfdbfe; cursor: pointer; }
        .weight-edit { font-size: 11px; opacity: 0.5; margin-left: 4px; }
        .weight-val:hover .weight-edit { opacity: 1; }
        .weight-input {
            width: 100%; text-align: center;
            background: rgba(0,0,0,0.35); border: 1px solid rgba(59,130,246,0.6);
            border-radius: 0.5rem; color: #fff; font-size: 0.875rem; font-weight: 700;
            padding: 5px 6px; font-family: inherit; outline: none;
        }

        /* ── Set buttons ── */
        .sets-area {
            padding: 1.25rem;
            background: linear-gradient(to bottom, transparent, rgba(0,0,0,0.1));
        }
        .sets-row { display: flex; flex-wrap: wrap; gap: 0.75rem; }
        .set-btn {
            flex: 1;
            min-width: 3rem;
            height: 3.5rem;
            border-radius: 1rem;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 900;
            font-size: 1.125rem;
            cursor: pointer;
            border: none;
            transition: all 0.3s;
        }
        .set-btn.pending {
            background: #1C2436;
            color: #64748b;
            border: 1px solid rgba(255,255,255,0.05);
        }
        .set-btn.pending:hover { border-color: rgba(255,255,255,0.2); }
        .set-btn.pending:active { transform: scale(0.95); }
        .set-btn.done {
            background: linear-gradient(135deg, #34d399, #059669);
            color: #fff;
            box-shadow: 0 10px 15px -3px rgba(16,185,129,0.2);
            transform: scale(0.98);
        }

        /* ── Tip box ── */
        .tip-box {
            padding: 1rem;
            border-radius: 1rem;
            border: 1px solid;
            display: flex;
            gap: 1rem;
            align-items: center;
        }
        .tip-box.blue {
            background: linear-gradient(to right, rgba(30,58,138,0.2), rgba(88,28,135,0.2));
            border-color: rgba(59,130,246,0.2);
        }
        .tip-box.orange {
            background: linear-gradient(to right, rgba(120,53,15,0.2), rgba(127,29,29,0.2));
            border-color: rgba(249,115,22,0.2);
        }
        .tip-icon {
            padding: 0.5rem;
            border-radius: 50%;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .tip-icon.blue { background: rgba(59,130,246,0.2); color: #60a5fa; }
        .tip-icon.orange { background: rgba(249,115,22,0.2); color: #fb923c; }
        .tip-text { font-size: 0.75rem; font-weight: 500; line-height: 1.625; }
        .tip-text.blue { color: rgba(191,219,254,0.7); }
        .tip-text.orange { color: rgba(254,215,170,0.8); }

        /* ── Bottom nav ── */
        .bottom-nav {
            position: fixed;
            bottom: 1rem;
            left: 1rem;
            right: 1rem;
            background: rgba(18,24,38,0.9);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 1.5rem;
            padding: 0.25rem;
            box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5);
            z-index: 40;
            display: flex;
            overflow-x: auto;
        }
        .bottom-nav::-webkit-scrollbar { display: none; }
        .bottom-nav { -ms-overflow-style: none; scrollbar-width: none; }

        .nav-btn {
            display: flex;
            flex-direction: column;
            align-items: center;
            min-width: 60px;
            flex: 1;
            padding: 0.75rem 0.25rem;
            border-radius: 1rem;
            border: none;
            background: none;
            cursor: pointer;
            color: #64748b;
            transition: all 0.3s;
            position: relative;
        }
        .nav-btn.active { background: rgba(255,255,255,0.1); color: #fff; }
        .nav-btn:not(.active):hover { background: rgba(255,255,255,0.05); color: #94a3b8; }
        .nav-icon { font-size: 1.25rem; line-height: 1; margin-bottom: 2px; transition: transform 0.3s; }
        .nav-btn.active .nav-icon { transform: scale(1.25); margin-bottom: 4px; }
        .nav-label { font-size: 9px; font-weight: 900; letter-spacing: 0.1em; text-transform: uppercase; }
        .nav-indicator {
            position: absolute;
            bottom: 0;
            width: 2rem;
            height: 4px;
            border-radius: 4px 4px 0 0;
        }

        /* ── Day gradient backgrounds ── */
        .g-orange  { background: linear-gradient(135deg, #f97316, #dc2626); }
        .g-blue    { background: linear-gradient(135deg, #3b82f6, #0891b2); }
        .g-green   { background: linear-gradient(135deg, #22c55e, #059669); }
        .g-purple  { background: linear-gradient(135deg, #a855f7, #db2777); }
        .g-indigo  { background: linear-gradient(135deg, #6366f1, #3b82f6); }
        .g-teal    { background: linear-gradient(135deg, #14b8a6, #059669); }
        .g-slate   { background: linear-gradient(135deg, #64748b, #334155); }

        /* ── Animations ── */
        @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.4} }
        .pulse { animation: pulse 2s cubic-bezier(.4,0,.6,1) infinite; }

        /* ── Desktop centering ── */
        @media (min-width: 500px) {
            body {
                background: #060910;
            }
            body::before {
                content: '';
                position: fixed;
                top: 0; bottom: 0;
                left: 50%;
                transform: translateX(-50%);
                width: 460px;
                background: #0B0F19;
                border-left: 1px solid rgba(255,255,255,0.05);
                border-right: 1px solid rgba(255,255,255,0.05);
                z-index: 0;
                pointer-events: none;
            }
            .app-header, main, #app { position: relative; z-index: 1; }
            .bottom-nav {
                left: 50%;
                right: auto;
                transform: translateX(-50%);
                width: 444px;
            }
        }

        /* ── Profile Button ── */
        @keyframes profilePulse {
            0%,100% { box-shadow: 0 0 0 0 rgba(99,102,241,0.5), 0 8px 32px -6px rgba(99,102,241,0.5); }
            50%      { box-shadow: 0 0 0 6px rgba(99,102,241,0),  0 8px 32px -6px rgba(99,102,241,0.6); }
        }
        .profile-btn {
            display: flex; align-items: center; justify-content: center; gap: 0.625rem;
            width: 100%;
            padding: 1.1rem 1.5rem;
            background: linear-gradient(135deg, #6366f1, #a855f7);
            border: none;
            border-radius: 1rem;
            color: #fff;
            font-size: 1rem; font-weight: 900;
            text-transform: uppercase; letter-spacing: 0.12em;
            cursor: pointer; transition: all 0.2s;
            margin-top: 1rem; font-family: inherit;
            animation: profilePulse 2.8s ease-in-out infinite;
        }
        .profile-btn:hover {
            background: linear-gradient(135deg, #4f46e5, #9333ea);
            transform: translateY(-2px);
            box-shadow: 0 12px 32px -6px rgba(99,102,241,0.6);
            animation: none;
        }
        .profile-btn:active { transform: scale(0.97); box-shadow: none; animation: none; }
        .profile-btn-icon { font-size: 1.25rem; line-height: 1; }

        /* ── Calendar Overlay ── */
        .cal-overlay {
            position: fixed; inset: 0;
            background: rgba(6,9,16,0.85);
            backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
            z-index: 50; overflow-y: auto;
            padding: 1rem; padding-bottom: 7rem;
        }
        .cal-panel {
            max-width: 448px; margin: 0 auto;
            background: #0f1623;
            border-radius: 1.5rem; border: 1px solid rgba(255,255,255,0.07);
            overflow: hidden; box-shadow: 0 30px 70px -15px rgba(0,0,0,0.9);
        }
        .cal-top-bar {
            display: flex; align-items: center; justify-content: space-between;
            padding: 1.25rem; border-bottom: 1px solid rgba(255,255,255,0.06);
            background: rgba(255,255,255,0.02);
        }
        .cal-panel-title { font-size: 1.125rem; font-weight: 900; color: #fff; font-style: italic; text-transform: uppercase; letter-spacing: -0.02em; }
        .cal-panel-sub   { font-size: 10px; color: #475569; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; margin-top: 3px; }
        .cal-close {
            width: 2rem; height: 2rem;
            background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.08);
            border-radius: 50%; color: #94a3b8; cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            font-size: 0.875rem; font-weight: 700; transition: all 0.2s;
            flex-shrink: 0; font-family: inherit;
        }
        .cal-close:hover { background: rgba(239,68,68,0.15); color: #f87171; border-color: rgba(239,68,68,0.2); }

        /* Analytics */
        .analytics-bar {
            display: grid; grid-template-columns: repeat(4,1fr);
            background: rgba(0,0,0,0.3); border-bottom: 1px solid rgba(255,255,255,0.05);
        }
        .analytics-stat { padding: 1rem 0.5rem; text-align: center; border-right: 1px solid rgba(255,255,255,0.05); }
        .analytics-stat:last-child { border-right: none; }
        .analytics-val { font-size: 1.375rem; font-weight: 900; color: #fff; line-height: 1; margin-bottom: 5px; font-family: monospace; letter-spacing: -0.04em; }
        .analytics-lbl { font-size: 8px; font-weight: 700; color: #475569; text-transform: uppercase; letter-spacing: 0.08em; }
        .av-green { color: #34d399; } .av-blue { color: #60a5fa; } .av-amber { color: #fb923c; } .av-red { color: #f87171; }

        /* Month Nav */
        .month-nav { display: flex; align-items: center; justify-content: space-between; padding: 1rem 1.25rem 0.625rem; }
        .month-label { font-size: 0.875rem; font-weight: 800; color: #e2e8f0; }
        .month-arrow {
            width: 2rem; height: 2rem;
            background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.07);
            border-radius: 0.5rem; color: #94a3b8; cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            transition: all 0.2s; font-size: 1.125rem; font-weight: 700; font-family: inherit;
        }
        .month-arrow:hover:not([disabled]) { background: rgba(255,255,255,0.1); color: #fff; }
        .month-arrow[disabled] { opacity: 0.25; cursor: default; }

        /* Grid */
        .cal-grid-wrap { padding: 0 1rem 0.75rem; }
        .cal-weekdays { display: grid; grid-template-columns: repeat(7,1fr); gap: 3px; margin-bottom: 4px; }
        .cal-weekday { text-align: center; font-size: 9px; font-weight: 700; color: #334155; text-transform: uppercase; letter-spacing: 0.06em; padding: 4px 0; }
        .cal-grid { display: grid; grid-template-columns: repeat(7,1fr); gap: 3px; }
        .cal-cell {
            aspect-ratio: 1; border-radius: 0.5rem;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            font-size: 0.7rem; font-weight: 700; cursor: pointer;
            border: 1px solid transparent; transition: all 0.15s;
            gap: 1px; line-height: 1; user-select: none;
        }
        .cal-cell.empty   { visibility: hidden; pointer-events: none; }
        .cal-cell.future  { color: #1e293b; pointer-events: none; }
        .cal-cell.completed { background: rgba(16,185,129,0.1);  border-color: rgba(16,185,129,0.2);  color: #34d399; }
        .cal-cell.completed:hover { background: rgba(16,185,129,0.18); border-color: rgba(16,185,129,0.35); }
        .cal-cell.skipped   { background: rgba(239,68,68,0.08);   border-color: rgba(239,68,68,0.18);   color: #f87171; }
        .cal-cell.skipped:hover { background: rgba(239,68,68,0.15); }
        .cal-cell.rest      { background: rgba(100,116,139,0.08); border-color: rgba(100,116,139,0.15); color: #64748b; }
        .cal-cell.rest:hover { background: rgba(100,116,139,0.15); }
        .cal-cell.nodata    { color: #334155; background: rgba(255,255,255,0.015); }
        .cal-cell.nodata:hover { background: rgba(255,255,255,0.04); color: #475569; }
        .cal-cell.today { background: rgba(99,102,241,0.3) !important; border-color: #6366f1 !important; color: #c4b5fd !important; font-weight: 900; }
        .cal-cell.selected { box-shadow: 0 0 0 2.5px #fff !important; }
        .cal-cell-icon { font-size: 0.55rem; line-height: 1; }
        .cal-cell.nodata .cal-cell-icon { color: #2d3a4a; font-size: 0.6rem; }
        .detail-pip { cursor: pointer; transition: opacity 0.15s, transform 0.15s; }
        .detail-pip:hover { opacity: 0.7; transform: scale(0.88); }
        /* Status Dropdown */
        .status-dropdown-wrap { position: relative; flex-shrink: 0; }
        .status-dropdown {
            position: absolute; right: 0; top: calc(100% + 6px);
            background: #1a2436; border: 1px solid rgba(255,255,255,0.1);

            exercises:[
              { name:"Walking (Low Intensity)", emoji:"🚶‍♂️", tags:["Active Recovery"], sets:1, reps:"30–60 mins", rest:0, weight:"Bodyweight" },
              { name:"Normal Daily Activity", emoji:"🧍", tags:["Keep Moving"], sets:1, reps:"All day", rest:0, weight:"N/A" },

           countdown, so backgrounding the app (which throttles or suspends
           setInterval) can't make it drift or stall. */
        const TIMER_KEY = 'gymRestTimer';
        let timerEndsAt = 0;      // epoch ms the rest ends; 0 = no timer running
        let totalRestTime = 0;    // seconds, for the progress ring
        let timeLeft = 0;         // derived from the clock, never decremented

        /* ── History helpers ── */
        function dateKey(d) {
            return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
        }
        function getHistory() {
            return JSON.parse(localStorage.getItem('gymHistory') || '{}');
        }
        function saveHistoryEntry() {
            const key = dateKey(new Date());
            const w = workoutData[activeDay];
            const total = w.exercises.reduce((a, ex) => a + ex.sets, 0);
            const done  = Object.keys(completedSets).filter(k => k.startsWith(`${activeDay}-`) && completedSets[k]).length;
            const status = w.isRest ? 'rest' : (done > 0 ? 'completed' : null);
            if (!status) return;
            const details = w.exercises.map((ex, ei) => ({
                name: ex.name, emoji: ex.emoji, sets: ex.sets,
                weight: loggedWeights[`${activeDay}-${ei}`] || ex.weight,
                doneSets: [...Array(ex.sets)].filter((_, si) => completedSets[`${activeDay}-${ei}-${si}`]).length
            }));
            const hist = getHistory();
            hist[key] = { status, completedSets: done, totalSets: total, workoutDay: activeDay, workoutTitle: w.title, workoutDetails: details };
            localStorage.setItem('gymHistory', JSON.stringify(hist));

        function seedDemoBodyweight() {
            if (localStorage.getItem('gymBodyweightSeeded')) return;
            const today = new Date();
            const log = [];

                const d = new Date(today); d.setDate(d.getDate() - i * 4);
                log.push({ date: dateKey(d), weight: +(123 - (8 - i) * 0.8).toFixed(1) });

            bodyweightLog = log;
            localStorage.setItem('gymBodyweight', JSON.stringify(log));
            localStorage.setItem('gymBodyweightSeeded', '1');
        }

            if (localStorage.getItem('gymLiftDemoSeeded')) return;
            const hist = getHistory();
            const today = new Date();
            const plans = [
                { dayIdx: 6, lift: 'Incline Chest Press', sessions: [[32,30],[27,32.5],[20,35],[13,37.5],[6,40]] },
                { dayIdx: 3, lift: 'Hack Squat',          sessions: [[30,80],[16,90],[2,100]] },
            ];
            plans.forEach(({ dayIdx, lift, sessions }) => {
                const w = workoutData[dayIdx];
                const total = w.exercises.reduce((a, e) => a + e.sets, 0);
                sessions.forEach(([ago, wt]) => {
                    const d = new Date(today); d.setDate(d.getDate() - ago);
                    hist[dateKey(d)] = {
                        status: 'completed', completedSets: total, totalSets: total,
                        workoutDay: dayIdx, workoutTitle: w.title,
                        workoutDetails: w.exercises.map(ex => ({
                            name: ex.name, emoji: ex.emoji, sets: ex.sets, doneSets: ex.sets,
                            weight: ex.name === lift ? `${wt} kg` : ex.weight
                        }))
                    };
                });
            });
            localStorage.setItem('gymHistory', JSON.stringify(hist));
            localStorage.setItem('gymLiftDemoSeeded', '1');
        }
        function seedDemoHistory() {
            if (localStorage.getItem('gymHistorySeeded')) return;
            const hist = getHistory();
            const today = new Date();
            const pattern = ['completed','rest','completed','completed','skipped','completed','rest',
                             'completed','completed','rest','skipped','completed','completed','completed'];
            for (let i = pattern.length; i >= 1; i--) {
                const d = new Date(today); d.setDate(d.getDate() - i);
                const k = dateKey(d);
                const wIdx = (d.getDay() + 6) % 7;
                const w = workoutData[wIdx];
                const rawSt = pattern[pattern.length - i];
                const status = w.isRest ? 'rest' : rawSt;
                const total  = w.exercises.reduce((a, e) => a + e.sets, 0);
                const done   = status === 'completed' ? total : 0;
                hist[k] = {
                    status, completedSets: done, totalSets: total,
                    workoutDay: wIdx, workoutTitle: w.title,
                    workoutDetails: w.exercises.map(ex => ({
                        name: ex.name, emoji: ex.emoji, sets: ex.sets, weight: ex.weight,
                        doneSets: status === 'completed' ? ex.sets : 0
                    }))
                };
            }
            localStorage.setItem('gymHistory', JSON.stringify(hist));
            localStorage.setItem('gymHistorySeeded', '1');
        }
        function calcMonthStats(year, month) {
            const hist  = getHistory();
            const today = new Date();
            let completed = 0, skipped = 0, rest = 0;
            const days = new Date(year, month + 1, 0).getDate();
            for (let d = 1; d <= days; d++) {
                const dt = new Date(year, month, d);
                if (dt > today) break;
                const e = hist[`${year}-${String(month+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`];
                if (!e) continue;
                if (e.status === 'completed') completed++;
                else if (e.status === 'skipped') skipped++;
                else if (e.status === 'rest')    rest++;
            }
            const consistency = (completed + skipped) > 0 ? Math.round(completed / (completed + skipped) * 100) : 0;
            let streak = 0;
            const chk = new Date();
            const todayE = hist[dateKey(chk)];
            if (!todayE || (todayE.status !== 'completed' && todayE.status !== 'rest')) {
                chk.setDate(chk.getDate() - 1); // today not logged yet — count back from yesterday
            }
            for (let i = 0; i < 365; i++) {
                const e = hist[dateKey(chk)];
                if (!e || (e.status !== 'completed' && e.status !== 'rest')) break;
                streak++; chk.setDate(chk.getDate() - 1);
            }
            return { completed, skipped, rest, consistency, streak };
        }

        /* ── Weight progression suggestion ──
           The app only records how many sets were marked done per session, not reps
           performed, so "hit the top of the rep range" is treated as "completed all
           prescribed sets". Suggestions are derived only from sessions where the user
           logged a concrete single-number working weight; range/seed strings are ignored. */
        const HEAVY_COMPOUNDS = ['Hack Squat', 'Leg Press', 'Romanian Deadlift', 'Hip Thrust'];
        function parseWeight(str) {
            if (!str) return null;
            const s = String(str);
            if (/\d+(?:\.\d+)?\s*[–-]\s*\d+(?:\.\d+)?/.test(s)) return null; // a range, not a working weight
            const m = s.match(/\d+(?:\.\d+)?/);
            return m ? parseFloat(m[0]) : null;
        }
        function formatSuggestion(origStr, newNum) {
            const n = Number.isInteger(newNum) ? String(newNum) : (Math.round(newNum * 2) / 2).toString();
            return String(origStr).replace(/\d+(?:\.\d+)?/, n);
        }
        function incrementFor(ex) {
            return (HEAVY_COMPOUNDS.includes(ex.name) || (ex.tags || []).includes('Compound')) ? 5 : 2.5;
        }
        function exerciseSessions(name) {
            const hist = getHistory();
            const out = [];
            Object.entries(hist).forEach(([k, ent]) => {
                const det = (ent.workoutDetails || []).find(d => d.name === name);
                if (!det) return;
                const num = parseWeight(det.weight);
                if (num == null) return;
                const [y, m, d] = k.split('-').map(Number);
                out.push({
                    t: new Date(y, m - 1, d).getTime(),
                    num, weightStr: det.weight,
                    success: (det.doneSets || 0) >= det.sets
                });
            });
            return out.sort((a, b) => b.t - a.t);
        }
        function progressionInfo(dayIdx, exIdx) {
            const ex = workoutData[dayIdx].exercises[exIdx];
            const sessions = exerciseSessions(ex.name);
            if (!sessions.length) return { weight: ex.weight, status: 'new' };
            const last = sessions[0];
            if (sessions.length >= 2 && !sessions[0].success && !sessions[1].success) {
                const nw = Math.round(last.num * 0.9 * 2) / 2;
                return { weight: formatSuggestion(last.weightStr, nw), status: 'down', delta: +(nw - last.num).toFixed(1) };
            }
            if (last.success) {
                const inc = incrementFor(ex);
                return { weight: formatSuggestion(last.weightStr, last.num + inc), status: 'up', delta: inc };
            }
            return { weight: last.weightStr, status: 'hold' };
        }
        function suggestedWeight(dayIdx, exIdx) { return progressionInfo(dayIdx, exIdx).weight; }

        /* ── Auto PR detection: today's logged weight beats the best prior logged weight ── */
        function isPR(dayIdx, exIdx) {
            const cur = parseWeight(loggedWeights[`${dayIdx}-${exIdx}`]);
            if (cur == null) return false;
            const today = new Date();
            const todayStart = new Date(today.getFullYear(), today.getMonth(), today.getDate()).getTime();
            const prior = exerciseSessions(workoutData[dayIdx].exercises[exIdx].name).filter(s => s.t < todayStart).map(s => s.num);
            return prior.length > 0 && cur > Math.max(...prior);
        }

        /* ── Bodyweight logging ── */
        function editBodyweight() { editingBodyweight = true; render(); }
        function saveBodyweight() {
            const dEl = document.getElementById('bw-date-input');
            const wEl = document.getElementById('bw-weight-input-active');
            const date = dEl ? dEl.value : dateKey(new Date());
            const weight = parseFloat(wEl ? wEl.value : '');
            if (date && !isNaN(weight)) {
                const i = bodyweightLog.findIndex(e => e.date === date);
                if (i >= 0) bodyweightLog[i].weight = weight;
                else bodyweightLog.push({ date, weight });
                bodyweightLog.sort((a, b) => a.date.localeCompare(b.date));
                localStorage.setItem('gymBodyweight', JSON.stringify(bodyweightLog));
            }
            editingBodyweight = false;
            render();
        }
        function setChartLift(name) { chartLift = name; render(); }
        function setTrendTab(tab) { trendTab = tab; render(); }

        /* ── Trend data (each metric kept fully separate) ── */
        const REST_LIFT_NAMES = new Set(workoutData.filter(d => d.isRest).flatMap(d => d.exercises.map(e => e.name)));
        const LIFT_BLOCKLIST = /walk|cardio|mobility|stretch|recovery|nutrition|rest/i;
        const LIFT_PRIORITY = ['Incline Chest Press','Hack Squat','Leg Press','Chest Press','Shoulder Press','Lat Pulldown','Seated Row'];
        const TREND_WINDOW_MS = 90 * 86400000;

        function bodyweightPoints() {
            const cutoff = Date.now() - TREND_WINDOW_MS;
            return bodyweightLog
                .filter(e => Number.isFinite(Number(e.weight)) && Number(e.weight) > 20)
                .map(e => { const [y, m, d] = e.date.split('-').map(Number); return { t: new Date(y, m - 1, d).getTime(), value: Number(e.weight) }; })
                .filter(p => p.t >= cutoff)
                .sort((a, b) => a.t - b.t);
        }
        function eligibleLifts() {
            const hist = getHistory();
            const freq = {};
            Object.values(hist).forEach(ent => {
                if (ent.status === 'rest') return;
                (ent.workoutDetails || []).forEach(d => {
                    if (REST_LIFT_NAMES.has(d.name) || LIFT_BLOCKLIST.test(d.name)) return;
                    const w = parseWeight(d.weight);
                    if (!(Number.isFinite(w) && w > 0)) return;
                    freq[d.name] = (freq[d.name] || 0) + 1;
                });
            });
            return Object.keys(freq).sort((a, b) => freq[b] - freq[a]);
        }
        function defaultLift(eligible) {
            for (const p of LIFT_PRIORITY) {
                const hit = eligible.find(n => n === p || n.includes(p));
                if (hit) return hit;
            }
            return eligible[0];
        }
        function liftPoints(name) {
            const hist = getHistory();
            const cutoff = Date.now() - TREND_WINDOW_MS;
            const pts = [];
            Object.entries(hist).forEach(([k, ent]) => {
                if (ent.status === 'rest') return;
                const det = (ent.workoutDetails || []).find(d => d.name === name);
                if (!det) return;
                const w = parseWeight(det.weight);
                if (!(Number.isFinite(w) && w > 0)) return;
                const [y, m, d] = k.split('-').map(Number);
                const t = new Date(y, m - 1, d).getTime();
                if (t < cutoff) return;
                pts.push({ t, value: w });
            });
            return pts.sort((a, b) => a.t - b.t);
        }

        /* ── Single-metric line chart (one Y-axis) ── */
        function buildLineChart(points, color, fillId) {
            const W = 320, H = 150, padL = 34, padR = 12, padT = 14, padB = 22;
            const plotW = W - padL - padR, plotH = H - padT - padB;
            let tMin = Math.min(...points.map(p => p.t)), tMax = Math.max(...points.map(p => p.t));
            if (tMin === tMax) { tMin -= 86400000; tMax += 86400000; }
            let vMin = Math.min(...points.map(p => p.value)), vMax = Math.max(...points.map(p => p.value));
            if (vMin === vMax) { vMin -= 1; vMax += 1; }
            const padv = (vMax - vMin) * 0.12; vMin -= padv; vMax += padv;
            const sx = t => padL + (t - tMin) / (tMax - tMin) * plotW;
            const sy = v => padT + (1 - (v - vMin) / (vMax - vMin)) * plotH;
            const baseY = padT + plotH;
            const fmtDate = t => { const d = new Date(t); return `${d.getDate()}/${d.getMonth() + 1}`; };
            const coords = points.map(p => `${sx(p.t).toFixed(1)},${sy(p.value).toFixed(1)}`);
            const dots = points.map(p => `<circle cx="${sx(p.t).toFixed(1)}" cy="${sy(p.value).toFixed(1)}" r="2.5" fill="${color}"/>`).join('');
            const line = `<polyline points="${coords.join(' ')}" fill="none" stroke="${color}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>`;
            const area = `<polygon points="${sx(points[0].t).toFixed(1)},${baseY} ${coords.join(' ')} ${sx(points[points.length-1].t).toFixed(1)},${baseY}" fill="url(#${fillId})" opacity="0.5"/>`;
            return `<svg viewBox="0 0 ${W} ${H}" role="img">
                <defs><linearGradient id="${fillId}" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="${color}" stop-opacity="0.35"/><stop offset="100%" stop-color="${color}" stop-opacity="0"/></linearGradient></defs>
                <line x1="${padL}" y1="${padT}" x2="${padL}" y2="${baseY}" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
                <line x1="${padL}" y1="${baseY}" x2="${W - padR}" y2="${baseY}" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
                <text x="${padL - 4}" y="${padT + 4}" fill="#475569" font-size="8" font-weight="700" text-anchor="end">${Math.round(vMax)}</text>
                <text x="${padL - 4}" y="${baseY}" fill="#475569" font-size="8" font-weight="700" text-anchor="end">${Math.round(vMin)}</text>
                ${area}${line}${dots}
                <text x="${padL}" y="${H - 6}" fill="#475569" font-size="8" font-weight="700">${fmtDate(tMin)}</text>
                <text x="${W - padR}" y="${H - 6}" fill="#475569" font-size="8" font-weight="700" text-anchor="end">${fmtDate(tMax)}</text>
            </svg>`;
        }
        function trendStats(current, change, days, good, unit) {
            const sign = change >= 0 ? '+' : '';
            return `<div class="trend-stats">
                <span class="trend-current">${current} ${unit}</span>
                <span class="trend-change ${good ? 'good' : 'bad'}">${sign}${change} ${unit} over ${days} days</span>
            </div>`;
        }
        function renderTrendSection() {
            const today = new Date();
            const todayK = dateKey(today);
            const todayBw = bodyweightLog.find(e => e.date === todayK);
            const bwCtrl = editingBodyweight
                ? `<input type="date" class="bw-date" id="bw-date-input" value="${todayK}" max="${todayK}">
                   <input type="number" inputmode="decimal" step="0.1" class="bw-input" id="bw-weight-input-active" placeholder="kg" value="${todayBw ? todayBw.weight : ''}"
                       onkeydown="if(event.key==='Enter'){saveBodyweight()}else if(event.key==='Escape'){editingBodyweight=false;render()}">
                   <button class="bw-save" onclick="saveBodyweight()">Save</button>`
                : `<span class="bw-val" onclick="editBodyweight()">${todayBw ? todayBw.weight + ' kg' : 'Log weight'} <span class="weight-edit">✎</span></span>`;

            let body = '';
            if (trendTab === 'bodyweight') {
                const pts = bodyweightPoints();
                if (pts.length < 2) {
                    body = `<div class="trend-empty">Log at least 2 bodyweight entries to see your trend.</div>`;
                } else {
                    const cur = pts[pts.length-1].value, first = pts[0].value;
                    const change = +(cur - first).toFixed(1);
                    const days = Math.max(1, Math.round((pts[pts.length-1].t - pts[0].t) / 86400000));
                    body = trendStats(cur, change, days, change <= 0, 'kg')
                         + `<div class="trend-chart">${buildLineChart(pts, '#a855f7', 'bwFill')}</div>`;
                }
            } else {
                const eligible = eligibleLifts();
                if (!eligible.length) {
                    body = `<div class="trend-empty">No weighted lift data yet. Log sets with weight to unlock lift trends.</div>`;
                } else {
                    const selected = eligible.includes(chartLift) ? chartLift : defaultLift(eligible);
                    const select = `<select class="lift-select" onchange="setChartLift(this.value)">
                        ${eligible.map(n => `<option value="${n}" ${n === selected ? 'selected' : ''}>${n}</option>`).join('')}
                    </select>`;
                    const pts = liftPoints(selected);
                    if (pts.length < 2) {
                        body = `<div class="trend-controls">${select}</div><div class="trend-empty">Log this exercise on at least 2 different dates to see progress.</div>`;
                    } else {
                        const cur = pts[pts.length-1].value, first = pts[0].value;
                        const change = +(cur - first).toFixed(1);
                        const days = Math.max(1, Math.round((pts[pts.length-1].t - pts[0].t) / 86400000));
                        body = `<div class="trend-controls">${select}</div>`
                             + trendStats(cur, change, days, change >= 0, 'kg')
                             + `<div class="trend-chart">${buildLineChart(pts, '#60a5fa', 'liftFill')}</div>`;
                    }
                }
            }
            return `
            <div class="trend-section">
                <div class="trend-head">
                    <span class="trend-title">📈 Progress Trends</span>
                    <div class="bw-edit">${bwCtrl}</div>
                </div>
                <div class="trend-tabs">
                    <button class="trend-tab ${trendTab==='bodyweight'?'active':''}" onclick="setTrendTab('bodyweight')">Bodyweight</button>
                    <button class="trend-tab ${trendTab==='lift'?'active':''}" onclick="setTrendTab('lift')">Lift Progress</button>
                </div>
                ${body}
            </div>`;
        }

            selectedCalendarDate = selectedCalendarDate === key ? null : key;

            editingCalWeightKey = null;
            scrollToDetail = !!selectedCalendarDate;
            render();
        }
        function openStatusDropdown(k, e) {
            e.stopPropagation();
            statusDropdownKey = statusDropdownKey === k ? null : k;
            render();
        }
        function setHistoryStatus(k, newStatus, e) {
            e.stopPropagation();
            const hist = getHistory();
            if (!hist[k]) return;
            hist[k].status = newStatus;
            if (newStatus === 'skipped') {
                hist[k].completedSets = 0;
                (hist[k].workoutDetails || []).forEach(ex => { ex.doneSets = 0; ex.doneSetsArr = Array(ex.sets).fill(false); });
            }
            localStorage.setItem('gymHistory', JSON.stringify(hist));
            statusDropdownKey = null;
            render();
        }
        function toggleHistorySet(k, exIdx, setIdx) {
            const hist = getHistory();
            if (!hist[k] || !hist[k].workoutDetails) return;
            const ex = hist[k].workoutDetails[exIdx];
            if (!ex) return;
            if (!ex.doneSetsArr) ex.doneSetsArr = [...Array(ex.sets)].map((_, i) => i < (ex.doneSets || 0));
            ex.doneSetsArr[setIdx] = !ex.doneSetsArr[setIdx];
            ex.doneSets = ex.doneSetsArr.filter(Boolean).length;
            const totalDone = hist[k].workoutDetails.reduce((a, d) => a + (d.doneSets || 0), 0);
            hist[k].completedSets = totalDone;
            if (hist[k].status !== 'rest') hist[k].status = totalDone > 0 ? 'completed' : 'skipped';
            localStorage.setItem('gymHistory', JSON.stringify(hist));
            render();
        }
        function createHistoryEntry(k) {
            const hist = getHistory();
            if (hist[k]) { render(); return; }
            const [y, m, d] = k.split('-').map(Number);
            const dow = new Date(y, m - 1, d).getDay();
            const wIdx = dow === 0 ? 6 : dow - 1;
            const w = workoutData[wIdx];
            hist[k] = {
                status: w.isRest ? 'rest' : 'skipped',
                completedSets: 0,
                totalSets: w.exercises.reduce((a, e) => a + e.sets, 0),
                workoutDay: wIdx, workoutTitle: w.title,
                workoutDetails: w.exercises.map(ex => ({
                    name: ex.name, emoji: ex.emoji, sets: ex.sets, weight: ex.weight, doneSets: 0
                }))
            };
            localStorage.setItem('gymHistory', JSON.stringify(hist));
            scrollToDetail = true;
            render();
        }

                                <button class="status-opt" onclick="setHistoryStatus('${selectedCalendarDate}','completed',event)"><span style="color:#34d399">✓</span> Completed</button>
                                <button class="status-opt" onclick="setHistoryStatus('${selectedCalendarDate}','skipped',event)"><span style="color:#f87171">✕</span> Skipped</button>
                                <button class="status-opt" onclick="setHistoryStatus('${selectedCalendarDate}','rest',event)"><span>💤</span> Rest Day</button>
                            </div>` : ''}
                        </div>
                    </div>
                    ${exRows}
                    ${ent.status !== 'rest' ? `<div class="detail-footer">
                        <span class="detail-footer-lbl">Sets Completed</span>
                        <span class="detail-footer-val">${ent.completedSets} / ${ent.totalSets}</span>
                    </div>` : ''}
                </div>`;
            } else if (selectedCalendarDate) {
                const [y2, m2, d2] = selectedCalendarDate.split('-').map(Number);
                const dStr = new Date(y2, m2-1, d2).toLocaleDateString('en-GB', { weekday:'long', day:'numeric', month:'long' });
                detailHTML = `
                <div class="detail-sheet">
                    <div class="detail-header">
                        <div>
                            <div class="detail-date-str">${dStr}</div>
                            <div class="detail-workout-name">No workout recorded</div>
                        </div>
                    </div>
                    <div class="detail-ex-row" style="justify-content:center;">
                        <button class="bw-save" onclick="createHistoryEntry('${selectedCalendarDate}')">＋ Log this day</button>
                    </div>
                </div>`;
            }

            return `
            <div class="cal-overlay" onclick="if(event.target===this)closeProfileCalendar()">
                <div class="cal-panel">
                    <div class="cal-top-bar">
                        <div>
                            <div class="cal-panel-title">📊 Workout History</div>
                            <div class="cal-panel-sub">Tap any date to inspect</div>
                        </div>
                        <button class="cal-close" onclick="closeProfileCalendar()">✕</button>
                    </div>
                    <div class="analytics-bar">
                        <div class="analytics-stat"><div class="analytics-val av-green">${stats.completed}</div><div class="analytics-lbl">Done</div></div>
                        <div class="analytics-stat"><div class="analytics-val av-blue">${stats.consistency}%</div><div class="analytics-lbl">Consistency</div></div>
                        <div class="analytics-stat"><div class="analytics-val av-amber">${stats.streak}</div><div class="analytics-lbl">🔥 Streak</div></div>
                        <div class="analytics-stat"><div class="analytics-val av-red">${stats.skipped}</div><div class="analytics-lbl">Skipped</div></div>
                    </div>
                    <div class="month-nav">
                        <button class="month-arrow" onclick="navCalendar(-1)" ${isPrevDisabled ? 'disabled' : ''}>&#8249;</button>
                        <span class="month-label">${MONTHS[month]} ${year}</span>
                        <button class="month-arrow" onclick="navCalendar(1)">&#8250;</button>
                    </div>
                    <div class="cal-grid-wrap">
                        <div class="cal-weekdays">${WEEKDAYS.map(d=>`<div class="cal-weekday">${d}</div>`).join('')}</div>
                        <div class="cal-grid">${cells}</div>
                    </div>
                    ${detailHTML}
                    <div class="cal-legend">
                        <div class="legend-item"><div class="legend-swatch completed"></div>Done</div>
                        <div class="legend-item"><div class="legend-swatch skipped"></div>Skipped</div>
                        <div class="legend-item"><div class="legend-swatch rest"></div>Rest</div>
                    </div>
                    ${renderTrendSection()}
                </div>
            </div>`;
        }

        function save() {
            localStorage.setItem('gymCompletedSets', JSON.stringify(completedSets));
        }

        /* ── Weight editing (main view) ── */
        function editWeight(exIdx) { editingWeightKey = exIdx; render(); }
        function cancelEditWeight() { editingWeightKey = null; render(); }
        function saveWeight(exIdx, val) {
            val = (val || '').trim();
            const wkey = `${activeDay}-${exIdx}`;
            if (val) loggedWeights[wkey] = val; else delete loggedWeights[wkey];
            localStorage.setItem('gymLoggedWeights', JSON.stringify(loggedWeights));
            editingWeightKey = null;
            saveHistoryEntry();
            render();
        }

        /* ── Weight editing (calendar history) ── */
        function editCalWeight(key, exIdx, e) { if (e) e.stopPropagation(); editingCalWeightKey = `${key}|${exIdx}`; render(); }
        function saveCalWeight(key, exIdx, val) {
            const hist = getHistory();
            const ex = hist[key] && hist[key].workoutDetails && hist[key].workoutDetails[exIdx];
            if (ex) {
                const v = (val || '').trim();
                if (v) ex.weight = v;
                localStorage.setItem('gymHistory', JSON.stringify(hist));
            }
            editingCalWeightKey = null;
            render();
        }

        function toggleSet(exIdx, setIdx, rest) {
            const key = `${activeDay}-${exIdx}-${setIdx}`;
            completedSets[key] = !completedSets[key];
            save();
            saveHistoryEntry();
            if (completedSets[key] && rest > 0) startTimer(rest);
            render();
        }

        function resetDay() {
            Object.keys(completedSets).forEach(k => {
                if (k.startsWith(`${activeDay}-`)) delete completedSets[k];
            });
            save();
            stopTimer();
            render();
        }

        function changeDay(idx) { activeDay = idx; editingWeightKey = null; render(); }

        /* Recompute timeLeft from the clock. Everything else reads this. */
        function syncTimer() {
            timeLeft = timerEndsAt ? Math.max(0, Math.ceil((timerEndsAt - Date.now()) / 1000)) : 0;
            return timeLeft;
        }

        function startTimer(secs) {
            stopTicking();
            totalRestTime = secs;
            timerEndsAt = Date.now() + secs * 1000;
            localStorage.setItem(TIMER_KEY, JSON.stringify({ endsAt: timerEndsAt, total: totalRestTime }));
            syncTimer();
            startTicking();
            primeAudio();      // we're inside the tap that logged the set, so audio unlocks here
            requestWakeLock();
            render();
        }

        /* Full teardown: used by Skip, Reset Day, and natural completion. */
        function stopTimer() {
            stopTicking();
            releaseWakeLock();
            timerEndsAt = 0;
            timeLeft = 0;
            localStorage.removeItem(TIMER_KEY);
        }

        function startTicking() {
            stopTicking();
            // 250ms so the digits flip on the right second even after a resume
            timerInterval = setInterval(tick, 250);
        }

        function stopTicking() {
            clearInterval(timerInterval);
            timerInterval = null;
        }

        function tick() {
            const prev = timeLeft;
            if (syncTimer() > 0) {
                if (timeLeft !== prev) updateTimerDOM();
                return;
            }
            stopTimer();
            restOverCue();
            render();
        }

        /* Called on load, on tab resume, and on bfcache restore. */
        function resumeTimer() {
            if (!timerEndsAt) return;
            if (syncTimer() > 0) {
                startTicking();
                requestWakeLock();
                updateTimerDOM();
            } else {
                // It ran out while we were away — clear it silently rather than
                // buzzing for a rest that ended minutes ago.
                stopTimer();
                render();
            }
        }

        function restoreTimer() {
            let saved = null;
            try { saved = JSON.parse(localStorage.getItem(TIMER_KEY) || 'null'); } catch (e) { saved = null; }
            if (!saved || !saved.endsAt) return;
            timerEndsAt = saved.endsAt;
            totalRestTime = saved.total || 0;
            if (syncTimer() > 0) { startTicking(); requestWakeLock(); }
            else stopTimer();
        }

        document.addEventListener('visibilitychange', () => {
            // Keep ticking while hidden so the cue still fires if the browser
            // lets us run; resumeTimer corrects the clock either way.
            if (document.hidden) releaseWakeLock();
            else resumeTimer();
        });
        window.addEventListener('pageshow', resumeTimer);
        window.addEventListener('focus', resumeTimer);

        /* ── Rest-over cue + screen wake lock ── */
        function primeAudio() {
            try {
                const Ctx = window.AudioContext || window.webkitAudioContext;
                if (!Ctx) return;
                if (!audioCtx) audioCtx = new Ctx();
                if (audioCtx.state === 'suspended') audioCtx.resume();
            } catch (e) { audioCtx = null; }
        }

        function restOverCue() {
            try { if (navigator.vibrate) navigator.vibrate([200, 100, 200]); } catch (e) {}
            try {
                if (!audioCtx) return;
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sine';
                osc.frequency.value = 880;
                gain.gain.setValueAtTime(0.0001, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.25, audioCtx.currentTime + 0.02);
                gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.6);
                osc.connect(gain); gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.6);
            } catch (e) {}
        }

        async function requestWakeLock() {
            try {
                if (!('wakeLock' in navigator) || wakeLock) return;
                wakeLock = await navigator.wakeLock.request('screen');
                wakeLock.addEventListener('release', () => { wakeLock = null; });
            } catch (e) { wakeLock = null; }
        }

        function releaseWakeLock() {
            try { if (wakeLock) wakeLock.release(); } catch (e) {}
            wakeLock = null;
        }

        function updateTimerDOM() {
            const digits = document.getElementById('timer-digits');
            if (digits) {
                const m = Math.floor(timeLeft / 60);
                const s = String(timeLeft % 60).padStart(2, '0');
                digits.textContent = `${m}:${s}`;
            }
            const ring = document.getElementById('timer-ring');
            if (ring && totalRestTime > 0) {
                ring.style.strokeDashoffset = 138 - (138 * timeLeft / totalRestTime);
            }
        }

        /* ── Render ── */
        function render() {
            syncTimer();   // always draw the timer from the clock, not stale state
            const w = workoutData[activeDay];
            const gradClass = GRAD[w.color] || 'g-slate';
            const totalSets = w.exercises.reduce((a, ex) => a + ex.sets, 0);
            const doneSets = Object.keys(completedSets).filter(k => k.startsWith(`${activeDay}-`) && completedSets[k]).length;
            const pct = totalSets === 0 ? 100 : Math.round(doneSets / totalSets * 100);

            /* Timer */
            let timerHTML = '';
            if (timeLeft > 0) {
                const m = Math.floor(timeLeft / 60);
                const s = String(timeLeft % 60).padStart(2, '0');
                const offset = 138 - (138 * timeLeft / totalRestTime);
                timerHTML = `
                <div class="timer-card">
                    <div class="timer-left">
                        <div class="timer-circle-wrap">
                            <svg class="timer-svg" viewBox="0 0 48 48">
                                <circle cx="24" cy="24" r="22" stroke="#1e293b" stroke-width="3" fill="none"/>
                                <circle id="timer-ring" cx="24" cy="24" r="22" stroke="#3b82f6" stroke-width="3" fill="none"
                                    stroke-dasharray="138" stroke-dashoffset="${offset}"
                                    style="transition:stroke-dashoffset 1s linear;"/>
                            </svg>
                            <span class="timer-clock-icon pulse">${IC.clock}</span>
                        </div>
                        <div>
                            <p class="timer-phase">Recovery Phase</p>
                            <p class="timer-digits" id="timer-digits">${m}:${s}</p>
                        </div>
                    </div>
                    <button class="timer-skip" onclick="stopTimer();render()">Skip</button>
                </div>`;
            }

            /* Exercises */
            const exercisesHTML = w.exercises.map((ex, exIdx) => {
                const allDone = ex.sets > 0 && [...Array(ex.sets)].every((_, i) => completedSets[`${activeDay}-${exIdx}-${i}`]);
                const tags = ex.tags.map(t => `<span class="tag">${t}</span>`).join('');
                const loggedW = loggedWeights[`${activeDay}-${exIdx}`];
                const prog = progressionInfo(activeDay, exIdx);
                const suggestion = prog.weight;
                const wDisplay = loggedW || suggestion;
                const editingThisWeight = editingWeightKey === exIdx;
                const progHint = loggedW ? '' : ({
                    up:   `<span class="prog-hint up">▲ +${prog.delta}kg vs last</span>`,
                    down: `<span class="prog-hint down">▼ deload ${prog.delta}kg</span>`,
                    hold: `<span class="prog-hint hold">— hold last weight</span>`,
                    new:  ''
                })[prog.status] || '';
                const sets = [...Array(ex.sets)].map((_, si) => {
                    const done = completedSets[`${activeDay}-${exIdx}-${si}`];
                    return `<button class="set-btn ${done ? 'done' : 'pending'}" onclick="toggleSet(${exIdx},${si},${ex.rest})">
                        ${done ? IC.check : si + 1}
                    </button>`;
                }).join('');

                const prBadge = isPR(activeDay, exIdx) ? `<span class="pr-badge">🏆 PR</span>` : '';

                return `
                <div class="ex-card ${allDone ? 'all-done' : ''}">
                    <div class="card-top">
                        <div class="card-emoji-bg">${ex.emoji}</div>
                        ${prBadge}
                        <div class="card-info-row">
                            <div class="card-img-wrap">
                                <img class="card-img" src="https://picsum.photos/seed/${ex.name.replace(/\s/g,'')}/150/150?grayscale" alt="${ex.name}" onerror="this.style.display='none'">
                                <span class="card-emoji-badge">${ex.emoji}</span>
                            </div>
                            <div>
                                <div class="card-name">${ex.name}</div>
                                <div class="tags">${tags}</div>
                            </div>
                        </div>
                        <div class="card-stats">
                            <div class="stat">
                                <span class="stat-label">Target</span>
                                <span class="stat-val" style="color:#fff">${IC.flame.replace('stroke="currentColor"','stroke="#f97316"')} ${ex.reps}</span>
                            </div>
                            <div class="stat">
                                <span class="stat-label">Volume</span>
                                <span class="stat-val" style="color:#fff">${IC.dumbbell.replace('stroke="currentColor"','stroke="#60a5fa"')} ${ex.sets} Sets</span>
                            </div>
                            <div class="stat">
                                <span class="stat-label">Rest</span>
                                <span class="stat-val" style="color:#fff">${IC.clockSm.replace('stroke="currentColor"','stroke="#34d399"')} ${ex.rest}s</span>
                            </div>
                        </div>
                        <div class="weight-box">
                            <span class="weight-label">${loggedW ? 'Working Weight' : 'Suggested Weight'}</span>
                            ${editingThisWeight
                                ? `<input class="weight-input" id="weight-input-active" value="${(loggedW || '').replace(/"/g,'&quot;')}" placeholder="${String(suggestion).replace(/"/g,'&quot;')}"
                                       onblur="saveWeight(${exIdx}, this.value)"
                                       onkeydown="if(event.key==='Enter'){this.blur()}else if(event.key==='Escape'){cancelEditWeight()}">`
                                : `<span class="weight-val" onclick="editWeight(${exIdx})">${wDisplay} <span class="weight-edit">✎</span></span>`}
                            ${progHint}
                        </div>
                    </div>
                    <div class="sets-area">
                        <div class="sets-row">${sets}</div>
                    </div>
                </div>`;
            }).join('');

            /* Nav */
            const navHTML = workoutData.map((d, i) => {
                const active = i === activeDay;
                const gc = GRAD[d.color] || 'g-slate';
                return `<button class="nav-btn ${active ? 'active' : ''}" onclick="changeDay(${i})">
                    <span class="nav-icon">${d.icon}</span>
                    <span class="nav-label">D${i + 1}</span>
                    ${active ? `<span class="nav-indicator ${gc}"></span>` : ''}
                </button>`;
            }).join('');

            /* Tip */
            const tipType = w.note ? 'orange' : 'blue';
            const tipText = w.note || 'Stay 1-3 reps from failure on big lifts. Focus on control, not ego.';

            const html = `
            <header class="app-header">
                <div class="header-row">
                    <div class="header-left">
                        <div class="day-badge ${gradClass}">${w.icon}</div>
                        <div>
                            <div class="workout-title">${w.title}</div>
                            <div class="workout-focus">${IC.target.replace('stroke="currentColor"','stroke="#60a5fa"')} ${w.focus}</div>
                        </div>
                    </div>
                    <button class="reset-btn" onclick="resetDay()">${IC.reset}</button>
                </div>
                <div class="progress-wrap">
                    <div class="progress-labels">
                        <span>${IC.activity} Progress</span>
                        <span>${doneSets} / ${totalSets} Sets</span>
                    </div>
                    <div class="progress-track">
                        <div class="progress-fill ${gradClass}" style="width:${pct}%"></div>
                    </div>
                </div>
            </header>

            <main>
                ${timerHTML}
                <div class="exercise-list">${exercisesHTML}</div>
                <div class="tip-box ${tipType}">
                    <div class="tip-icon ${tipType}">${IC.info}</div>
                    <p class="tip-text ${tipType}">${tipText}</p>
                </div>
                <button class="profile-btn" onclick="toggleProfileCalendar()">
                    <span class="profile-btn-icon">📊</span> Check Profile
                </button>
            </main>

            <nav class="bottom-nav">${navHTML}</nav>
            ${showProfileCalendar ? renderProfileCalendar() : ''}`;

            const scrollY = window.scrollY;
            document.getElementById('app').innerHTML = html;
            window.scrollTo(0, scrollY);

            const wInput = document.getElementById('weight-input-active') || document.getElementById('cal-weight-input-active') || document.getElementById('bw-weight-input-active');
            if (wInput) { wInput.focus(); wInput.select(); }

            if (scrollToDetail) {
                scrollToDetail = false;
                requestAnimationFrame(() => {
                    const ds = document.querySelector('.detail-sheet');
                    if (ds) ds.scrollIntoView({ behavior: 'smooth', block: 'center' });
                });
            }
        }

        window.onload = () => { seedDemoHistory(); seedDemoBodyweight(); seedDemoLifts(); restoreTimer(); render(); };

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => navigator.serviceWorker.register('sw.js'));
        }
    </script>
</body>
</html>
